name: Conteudo API - CI/CD

on:
  push:
    paths:
      - 'src/backend/conteudo-api/**'
  pull_request:
    paths:
      - 'src/backend/conteudo-api/**'

env:
  DOTNET_VERSION: '8.0.x'

jobs:

  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore src/backend/conteudo-api/Conteudo.API.sln

      - name: Build
        run: dotnet build src/backend/conteudo-api/Conteudo.API.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/backend/conteudo-api/Conteudo.API.sln --no-build

  docker-build-push:
    needs: build-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Build & Push
        uses: docker/build-push-action@v5
        with:
          context: src/backend/conteudo-api
          file: src/backend/conteudo-api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/project5-conteudo-api:latest
            ${{ secrets.DOCKER_USERNAME }}/project5-conteudo-api:${{ github.sha }}
