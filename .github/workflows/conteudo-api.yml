name: Conteudo-API - CI/CD

on:
  pull_request:
    branches: [ DEV, PR, main ]
    paths:
      - 'src/backend/conteudo-api/**'

  push:
    branches: [ DEV, PR, main ]
    paths:
      - 'src/backend/conteudo-api/**'

env:
  DOTNET_VERSION: '9.0.x'

jobs:

  # ===============================================
  # BUILD + TESTES DO MICROSSERVIÇO (CI RÁPIDO)
  # Rodado em:
  #   - PR → DEV, PR, main
  #   - Push → DEV, PR
  # ===============================================
  service-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configuração .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore do microsserviço Conteudo-API
        run: dotnet restore src/backend/conteudo-api/Conteudo.API.sln

      - name: Build do microsserviço Conteudo-API
        run: dotnet build src/backend/conteudo-api/Conteudo.API.sln --configuration Release --no-restore

      - name: Execução de Testes Unitários Conteudo-API
        run: dotnet test src/backend/tests/Conteudo.UnitTests/Conteudo.UnitTests.csproj --configuration Release

      - name: Execução de Testes Integrados Conteudo-API
        run: dotnet test src/backend/tests/Conteudo.IntegrationTests/Conteudo.UnitTests.csproj --configuration Release

  # ===============================================
  # TESTES COMPLETOS (APENAS MAIN = CI completo)
  # ===============================================
  full-tests:
    needs: service-tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Configuração .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore Full da Solution MBA.Modulo5
        run: dotnet restore src/backend/MBA.Modulo5.sln

      - name: Execução de Testes do eco-sistema
        run: dotnet test src/backend/MBA.Modulo5.sln --configuration Release 

  # ===============================================
  # DEPLOY (DOCKER BUILD & PUSH)
  # Somente MAIN
  # ===============================================
  docker-build-push:
    needs: full-tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Credenciais do repositório Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Criação da imagem e Push no repositório do Docker Hub do microsserviço Conteudo-API
        uses: docker/build-push-action@v5
        with:
          context: src/backend
          file: src/backend/conteudo-api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/project5-conteudo-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/project5-conteudo-api:${{ github.sha }}
