name: Auth API - CI/CD

on:
  push:
    paths:
      - 'src/backend/auth-api/**'
  pull_request:
    paths:
      - 'src/backend/auth-api/**'

env:
  DOTNET_VERSION: '8.0.x'

jobs:

  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📦 Restore
        run: dotnet restore src/backend/auth-api/Auth.API.sln

      - name: 🏗 Build
        run: dotnet build src/backend/auth-api/Auth.API.sln --configuration Release --no-restore

      - name: 🧪 Testes
        run: dotnet test src/backend/auth-api/Auth.API.sln --no-build

  docker-build-push:
    needs: build-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Debug Docker secrets
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "USERNAME está VAZIO!"
          else
            echo "USERNAME está DEFINIDO (mas oculto)."
          fi

          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "TOKEN está VAZIO!"
          else
            echo "TOKEN está DEFINIDO (mas oculto)."
          fi

      - name: 🔐 Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: "jsouzalp"
          password: "dckr_pat_B-eZxN5y37DwEdkfMh6kjpFIBCI"

      - name: 🐳 Docker Build & Push
        uses: docker/build-push-action@v5
        with:
          context: src/backend/auth-api
          file: src/backend/auth-api/Dockerfile
          push: true
          tags: |
            jsouzalp/project5-auth-api:latest
            jsouzalp/project5-auth-api:${{ github.sha }}
