name: Pagamentos API - CI/CD

on:
  pull_request:
    branches: [ DEV, PR, main ]
    paths:
      - 'src/backend/pagamentos-api/**'

  push:
    branches: [ DEV, PR, main ]
    paths:
      - 'src/backend/pagamentos-api/**'

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore src/backend/pagamentos-api/Pagamentos.API.sln
      - name: Build
        run: dotnet build src/backend/pagamentos-api/Pagamentos.API.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test src/backend/pagamentos-api/Pagamentos.API.sln --no-build

  docker-build-push:
    needs: build-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Build and Push
        uses: docker/build-push-action@v5
        with:
          context: src/backend
          file: src/backend/pagamentos-api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/project5-pagamentos-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/project5-pagamentos-api:${{ github.sha }}
