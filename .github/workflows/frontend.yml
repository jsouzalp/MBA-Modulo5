name: Frontend - CI/CD

on:
  pull_request:
    branches: [ DEV, PR, main ]
    paths:
      - 'src/frontend/**'

  push:
    branches: [ DEV, PR, main ]
    paths:
      - 'src/frontend/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install de Dependências
        run: |
          cd src/frontend
          npm install

      - name: Build do projeto em Angular
        run: |
          cd src/frontend
          npm run build --if-present

  docker-build-push:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Credenciais do repositório Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Criação da imagem e Push no repositório do Docker Hub da camada de Front-End
        uses: docker/build-push-action@v5
        with:
          context: src/frontend
          file: src/frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/project5-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/project5-frontend:${{ github.sha }}
