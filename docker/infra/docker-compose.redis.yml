services:
  redis:
    image: redis:7-alpine
    container_name: plataforma-redis
    ports:
      - "6379:6379"
    expose:
      - 6379
    volumes:
      - redis_data:/data
    networks:
      - plataforma-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  redis_data: 
  
networks:
  plataforma-network:
    external: true
    name: "plataforma-network"
