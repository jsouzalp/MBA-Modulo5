services:
  pagamentos-api:
    image: educa/pagamentos-api:latest
    container_name: plataforma-pagamentos-api
    env_file:
      - ../../src/backend/.env
    build:
      context: ../../src/backend
      dockerfile: pagamentos-api/Dockerfile
    ports:
      - '5004:5004'
    expose:
      - 5004
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:5004;http://+:7004
      - ASPNETCORE_Kestrel__Certificates__Default__Password=${CERTIFICATES}
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=PagamentosDB;User Id=sa;Password=${DB_PASSWORD_PAGAMENTO};TrustServerCertificate=True;
      - JwtSettings__SecretKey=${JWT_SECRET_KEY}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__Username=admin
      - RabbitMQ__Password=${RABBITMQ_PASSWORD}
    networks:
      - plataforma-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5004/health']
      interval: 15s
      timeout: 5s
      retries: 5

# volumes:
#   pagamentos-api-volume: 

networks:
  plataforma-network:
    name: "plataforma-network"
    external: true

