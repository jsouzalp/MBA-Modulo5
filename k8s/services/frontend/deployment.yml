apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: plataforma-educacional
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: educa/frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4200
          livenessProbe:
            httpGet: { path: "/", port: 4200 }
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: "/", port: 4200 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "128Mi" }
