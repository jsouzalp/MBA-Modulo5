apiVersion: apps/v1
kind: Deployment
metadata:
  name: conteudo-api
  namespace: plataforma-educacional
spec:
  replicas: 2
  selector:
    matchLabels:
      app: conteudo-api
  template:
    metadata:
      labels:
        app: conteudo-api
    spec:
      containers:
        - name: conteudo-api
          image: educa/conteudo-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5002
          envFrom:
            - configMapRef: { name: conteudo-api-config }
            - secretRef:    { name: conteudo-api-secret }
          livenessProbe:
            httpGet: { path: /health, port: 5002 }
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health, port: 5002 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "300m", memory: "256Mi" }
